# ==================================================
# Kitty - Batman (Bright Yellow & Blue)
# ==================================================

# Font
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.5
disable_ligatures never

# Window
background_opacity 0.55
dynamic_background_opacity yes
confirm_os_window_close 0
remember_window_size yes
window_padding_width 10
hide_window_decorations no

# Cursor
cursor_shape beam
cursor_beam_thickness 1.5
cursor_blink_interval 0.6
cursor_stop_blinking_after 0
cursor_trail 8
cursor_trail_decay 0.15 0.7

# Bell
enable_audio_bell no
visual_bell_duration 0

# Scrolling
scrollback_lines 20000
wheel_scroll_multiplier 5.0

# Performance
repaint_delay 8
input_delay 2
sync_to_monitor yes

# Selection
copy_on_select yes
strip_trailing_spaces smart

# Tab Bar
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_bar_margin_height 0 6

# Batman Palette
foreground              #f5f3ff
background              #0a0a0f
selection_foreground    #0a0a0f
selection_background    #ffe600

cursor                  #ffe600
cursor_text_color       #0a0a0f

url_color               #3d7bff

active_border_color     #ffe600
inactive_border_color   #1c1c26
bell_border_color       #3d7bff

active_tab_foreground   #0a0a0f
active_tab_background   #ffe600

inactive_tab_foreground #6e7a9c
inactive_tab_background #14141c

mark1_foreground #0a0a0f
mark1_background #ffe600

# Black
color0  #0a0a0f
color8  #4a4a5c

# Red
color1  #eb3b5a
color9  #ff6b8a

# Green
color2  #2ecc71
color10 #6be392

# Yellow
color3  #ffe600
color11 #fff066

# Blue
color4  #3d7bff
color12 #7ca7ff

# Magenta
color5  #7c5cff
color13 #a58cff

# Cyan
color6  #4dd0e1
color14 #8ae6f2

# White
color7  #f5f3ff
color15 #ffffff

allow_remote_control yes
listen_on unix:/tmp/kitty

# Clipboard Operations
map ctrl+c copy_or_interrupt
map ctrl+v paste_from_clipboard
map ctrl+a pipe @text clipboard dummy
map ctrl+backspace send_text all \x1